name: Android build

on:
  push:
    branches: [main, 'fix/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: APK (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: fr
            directory: .
          - language: en
            directory: batocera_remote_en
    defaults:
      run:
        working-directory: ${{ matrix.directory }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.41.0'
          cache: true
      - name: Install dependencies from lockfile
        run: flutter pub get --enforce-lockfile
      - name: Test uinput protocol
        if: matrix.language == 'fr'
        run: python3 "$GITHUB_WORKSPACE/tests/test_vpad_protocol.py"
      - name: Test controller widgets
        run: flutter test
      - name: Analyze source
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Build release APK
        run: flutter build apk --release
      - name: Upload APK
        uses: actions/upload-artifact@v5
        with:
          name: foclabroc-remote-${{ matrix.language }}-apk
          path: ${{ matrix.directory }}/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
